name: Recover optimization runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-optimization-runner.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure server SSH
        env:
          UPDATE_SSH_PRIVATE_KEY: ${{ secrets.ANDROID_UPDATE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SSH_PRIVATE_KEY"
          KEYFILE="$RUNNER_TEMP/server-ssh"
          printf '%s\n' "$UPDATE_SSH_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ssh-keyscan -H 34.132.172.40 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "SERVER_SSH_KEYFILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Restart self-hosted Actions runner
        run: |
          set -euo pipefail
          ssh -i "$SERVER_SSH_KEYFILE" kpj3669@34.132.172.40 \
            "sudo -n systemctl restart actions.runner.nictunz-universal-trading-bot.trading-bot-server.service && sudo -n systemctl is-active actions.runner.nictunz-universal-trading-bot.trading-bot-server.service"
