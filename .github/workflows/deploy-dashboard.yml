name: deploy-paper-dashboard

on:
  push:
    branches: [main]
    paths:
      - 'universal_bot/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: deploy-paper-dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy isolated PAPER runtime
        run: |
          set -euo pipefail
          APP_DIR=/home/kpj3669/universal-trading-bot-dashboard
          VENV=/home/kpj3669/.cache/universal-trading-bot-dashboard-venv
          mkdir -p "$APP_DIR" /home/kpj3669/.cache/universal-trading-bot
          rsync -a --delete --exclude '.git' --exclude '.env' --exclude 'data/' ./ "$APP_DIR/"
          if [[ ! -x "$VENV/bin/python" ]]; then
            python3 -m venv "$VENV"
            "$VENV/bin/python" -m pip install --upgrade pip
          fi
          "$VENV/bin/pip" install -e "$APP_DIR"
          cat > "$APP_DIR/.env" <<'EOF'
          BOT_MODE=PAPER
          EXCHANGE=bitget
          ASSET_CLASS=crypto
          SYMBOL=ETH/USDT:USDT
          SYMBOLS=ETH/USDT:USDT
          TIMEFRAME=5m
          USE_FOUR_CRYPTO_EXCHANGES=true
          DATABASE_URL=sqlite:////home/kpj3669/.cache/universal-trading-bot/historical.db
          DASHBOARD_HOST=0.0.0.0
          DASHBOARD_PORT=8000
          EOF

      - name: Install or restart dashboard service
        run: |
          set -euo pipefail
          cat > /tmp/universal-trading-bot-dashboard.service <<'EOF'
          [Unit]
          Description=Universal Trading Bot PAPER Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=kpj3669
          WorkingDirectory=/home/kpj3669/universal-trading-bot-dashboard
          EnvironmentFile=/home/kpj3669/universal-trading-bot-dashboard/.env
          ExecStart=/home/kpj3669/.cache/universal-trading-bot-dashboard-venv/bin/python -m universal_bot.main
          Restart=always
          RestartSec=5
          KillSignal=SIGINT
          TimeoutStopSec=15

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo install -m 0644 /tmp/universal-trading-bot-dashboard.service /etc/systemd/system/universal-trading-bot-dashboard.service
          sudo systemctl daemon-reload
          sudo systemctl enable universal-trading-bot-dashboard.service
          sudo systemctl restart universal-trading-bot-dashboard.service
          sleep 8
          sudo systemctl --no-pager --full status universal-trading-bot-dashboard.service | tee /tmp/dashboard-service-status.txt

      - name: Verify dashboard locally
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/dashboard-http-status.txt
          import time, urllib.request
          urls = [
              'http://127.0.0.1:8000/health',
              'http://127.0.0.1:8000/api/state',
              'http://127.0.0.1:8000/',
          ]
          for attempt in range(20):
              try:
                  for u in urls:
                      with urllib.request.urlopen(u, timeout=5) as r:
                          body = r.read().decode('utf-8')
                          print(u, r.status, body[:500])
                  break
              except Exception:
                  if attempt == 19:
                      raise
                  time.sleep(2)
          PY

      - name: Show listening socket
        run: |
          set -euo pipefail
          ss -ltnp | grep ':8000' | tee /tmp/dashboard-socket.txt

      - name: Publish deployment report
        if: always()
        run: |
          set -euo pipefail
          REPORT=$(mktemp)
          {
            echo '# Latest dashboard deployment'
            echo
            echo "- Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source commit: $GITHUB_SHA"
            echo '- Mode: PAPER'
            echo '- Host: trading-bot-new'
            echo '- Bind: 0.0.0.0:8000'
            echo '- Expected URL: http://34.132.172.40:8000/'
            echo
            echo '## Service'
            echo '```text'
            cat /tmp/dashboard-service-status.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## HTTP checks'
            echo '```text'
            cat /tmp/dashboard-http-status.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Socket'
            echo '```text'
            cat /tmp/dashboard-socket.txt 2>/dev/null || true
            echo '```'
          } > "$REPORT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B dashboard-deployment-report origin/main
          mkdir -p reports
          cp "$REPORT" reports/latest-dashboard-deployment.md
          git add reports/latest-dashboard-deployment.md
          if ! git diff --cached --quiet; then
            git commit -m 'ci: update dashboard deployment report [skip ci]'
            git push origin HEAD:main
          fi
