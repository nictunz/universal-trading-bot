name: Android PR compile check
on:
  pull_request:
    paths:
      - 'android/**'
      - 'universal_bot/**'
      - '.github/workflows/android-pr-check.yml'
permissions:
  contents: read
concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Sync Android Python modules
        run: |
          cp -R universal_bot android/app/src/main/python/universal_bot
          cp android/compat/config.py android/app/src/main/python/universal_bot/config.py
          cp android/compat/historical.py android/app/src/main/python/universal_bot/historical.py
      - name: Compile unsigned release
        run: gradle -p android :app:assembleRelease --stacktrace
