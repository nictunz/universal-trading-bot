name: Priority parity backtest one-shot

on:
  push:
    paths:
      - '.github/workflows/priority-parity-backtest-once.yml'

permissions:
  contents: write

jobs:
  wire-priority-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire integrated LIVE priority backtest into Android
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('android/app/src/main/python/mobile_bridge.py')
          text = bridge.read_text(encoding='utf-8')
          anchor = '\ndef run_backtest(\n'
          if anchor not in text:
              raise SystemExit('mobile_bridge run_backtest anchor missing')
          wrapper = r'''
def run_priority_live_backtest(
    symbol: str,
    start_text: str,
    end_text: str,
    output_dir: str,
    database_path: str,
    initial_capital: float = 1000.0,
    compounding_enabled: bool = True,
) -> str:
    """One-pass historical replay of the actual 5m+15m Priority ownership rules."""
    from universal_bot.priority_backtest import run_priority_backtest
    logs = [
        "LIVE 통합 Priority 백테스트 시작",
        "5분 9.55배 + 15분 5배 · 단일 포지션 · 5분 우선/15분 선점 해제",
        "신호봉 확정 종가 · 고정 TP/SL · 동봉 SL 우선 · 수수료 0.02% + 슬리피지 0.01%/side",
    ]
    result = run_priority_backtest(
        database_path=database_path,
        start=start_text,
        end=end_text,
        initial_capital=float(initial_capital),
        compounding=bool(compounding_enabled),
        symbol=symbol,
    )
    history_dir = Path(output_dir) / "BacktestResults"
    history_dir.mkdir(parents=True, exist_ok=True)
    stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%S%fZ")
    archive = history_dir / f"{stamp}-btc-usdt-priority-live-parity.json"
    payload = dict(result)
    payload.update({
        "database": str(database_path),
        "requested_start": start_text,
        "requested_end": end_text,
        "selected_database": True,
        "result_path": str(archive),
        "optimization_pipeline": {"stage": "priority_live_parity", "paper_live_applied": False},
    })
    archive.write_text(json.dumps(payload, ensure_ascii=False, indent=2, allow_nan=False) + "\n", encoding="utf-8")
    logs.append(
        f"통합 백테스트 완료 · 거래 {int(payload.get('trades') or 0)} · "
        f"수익률 {float(payload.get('return_percent') or 0):.2f}% · "
        f"MDD {float(payload.get('max_drawdown_percent') or 0):.2f}%"
    )
    return json.dumps({"db": str(database_path), "result": str(archive), "summary": payload, "logs": logs}, ensure_ascii=False)

'''
          text = text.replace(anchor, '\n' + wrapper + 'def run_backtest(\n', 1)
          bridge.write_text(text, encoding='utf-8')

          service = Path('android/app/src/main/java/com/nictunz/universalbacktester/BacktestForegroundService.java')
          text = service.read_text(encoding='utf-8')
          old = '''            } else {
                response = bridge.callAttr(
                    "run_backtest",'''
          new = '''            } else if (request.optBoolean("priority_live_parity", false)) {
                updateNotification("LIVE 5분+15분 통합 백테스트 실행 중");
                response = bridge.callAttr(
                    "run_priority_live_backtest",
                    request.getString("symbol"),
                    request.getString("start"),
                    request.getString("end"),
                    request.getString("output_dir"),
                    request.optString("database_path", ""),
                    request.optDouble("initial_capital", 1000.0),
                    request.optBoolean("compounding_enabled", true)
                ).toString();
            } else {
                response = bridge.callAttr(
                    "run_backtest",'''
          if old not in text:
              raise SystemExit('service dispatch anchor missing')
          text = text.replace(old, new, 1)
          old = '        request.put("database_path", intent.getStringExtra("database_path"));\n'
          new = old + '        request.put("priority_live_parity", intent.getBooleanExtra("priority_live_parity", false));\n'
          if old not in text:
              raise SystemExit('service request anchor missing')
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          main = Path('android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java')
          text = main.read_text(encoding='utf-8')
          old = '''        Button priorityPreset = actionButton("🟢 실거래 동등 프로필 · 5분 / 15분", SUCCESS);
        priorityPreset.setOnClickListener(v -> new AlertDialog.Builder(this)
                .setTitle("현재 LIVE 동등 프로필")
                .setItems(new String[]{"BTC 5분 · 9.55배 · 신호봉 확정 즉시", "BTC 15분 · 5배 · 신호봉 확정 즉시"},
                        (dialog, which) -> loadPriorityPreset(which == 0 ? "5m" : "15m"))
                .setNegativeButton("취소", null).show());
        backtestCard.addView(priorityPreset, marginTop(12));
        backtestCard.addView(text("LIVE 동등 기준: 신호봉 확정 종가 진입(signal_close) · 편도 수수료 0.02% + 슬리피지 0.01% · 최대 진입 1회 · TP/SL은 최초 진입가 기준 고정. 데이터가 정상일 때 서버는 별도 대기 없이 주문합니다. 5분/15분 우선 전환 조합 성과는 단일 프로필 결과와 구분합니다.",
                12, MUTED, false), marginTop(6));'''
          new = '''        Button priorityPreset = actionButton("🟢 LIVE 통합 백테스트 · 5분 9.55배 + 15분 5배", SUCCESS);
        priorityPreset.setOnClickListener(v -> startPriorityLiveParityBacktest());
        backtestCard.addView(priorityPreset, marginTop(12));
        backtestCard.addView(text("두 전략을 따로 계산하지 않습니다. 실제 Priority Runtime처럼 하나의 포지션을 공유하고 5분 신호가 15분보다 우선하며, 15분 보유 중 5분 신호가 오면 15분을 정리한 뒤 5분으로 전환합니다. 신호봉 확정 종가 · 고정 TP/SL · 동봉 SL 우선 · 편도 수수료 0.02% + 슬리피지 0.01%.",
                12, MUTED, false), marginTop(6));'''
          if old not in text:
              raise SystemExit('MainActivity priority button anchor missing')
          text = text.replace(old, new, 1)

          method_anchor = '    private void startBacktest(JSONObject fixedParameters) {\n'
          if method_anchor not in text:
              raise SystemExit('MainActivity startBacktest anchor missing')
          method = r'''    private void startPriorityLiveParityBacktest() {
        String symbol = symbolInput.getText().toString().trim();
        if (!"BTC/USDT:USDT".equalsIgnoreCase(symbol)) {
            toast("LIVE 통합 프로필은 BTC/USDT:USDT 전용입니다.");
            return;
        }
        if (selectedDbPath == null || selectedDbPath.trim().isEmpty()) {
            toast("먼저 5분·15분 및 4거래소 데이터가 들어있는 저장 DB를 선택하세요.");
            return;
        }
        String start = startInput.getText().toString().trim();
        String end = endInput.getText().toString().trim();
        Calendar startCal = parseDate(start);
        Calendar endCal = parseDate(end);
        if (startCal == null || endCal == null || endCal.before(startCal)) {
            toast("백테스트 시작일과 종료일을 확인하세요.");
            return;
        }
        double initialCapital;
        try {
            initialCapital = Double.parseDouble(initialCapitalInput.getText().toString().trim().replace(",", ""));
        } catch (Exception ignored) {
            toast("초기자산을 숫자로 입력하세요.");
            return;
        }
        boolean compounding = !"고정식".equals(sizingModeInput.getText().toString().trim());
        new AlertDialog.Builder(this)
                .setTitle("LIVE 통합 Priority 백테스트")
                .setMessage("5분 9.55배 + 15분 5배를 한 계좌/한 포지션으로 시간순 재생합니다.\n\n"
                        + "• 5분 신호 우선\n• 5분 보유 중 신규 신호 차단\n"
                        + "• 15분 보유 중 5분 신호 → 15분 정리 후 5분 진입\n"
                        + "• 고정 TP/SL · 동봉 SL 우선\n• 수수료 0.02% + 슬리피지 0.01% / side")
                .setPositiveButton("통합 백테스트 실행", (dialog, which) -> {
                    Intent intent = new Intent(this, BacktestForegroundService.class);
                    intent.setAction(BacktestForegroundService.ACTION_START);
                    intent.putExtra("symbol", "BTC/USDT:USDT");
                    intent.putExtra("timeframe", "5m+15m");
                    intent.putExtra("start", start);
                    intent.putExtra("end", end);
                    intent.putExtra("database_path", selectedDbPath);
                    intent.putExtra("initial_capital", initialCapital);
                    intent.putExtra("compounding_enabled", compounding);
                    intent.putExtra("priority_live_parity", true);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent);
                    else startService(intent);
                    lastDbPath = "";
                    lastResultPath = "";
                    lastUploadEligible = false;
                    lastSummary = null;
                    enableUpload(false);
                    enableResultActions(false);
                    setFullLog("LIVE 통합 Priority 백테스트 시작\n5분 9.55배 + 15분 5배 · 단일 포지션 · 5분 우선\n");
                    setBusy(true, "LIVE 통합 백테스트 실행 중");
                    setBacktestControlState("RUNNING");
                    toast("5분+15분 통합 백테스트를 시작했습니다.");
                })
                .setNegativeButton("취소", null)
                .show();
    }

'''
          text = text.replace(method_anchor, method + method_anchor, 1)
          main.write_text(text, encoding='utf-8')
          PY
      - name: Verify source wiring
        run: |
          python -m py_compile universal_bot/priority_backtest.py android/app/src/main/python/mobile_bridge.py
          grep -q 'run_priority_live_backtest' android/app/src/main/python/mobile_bridge.py
          grep -q 'priority_live_parity' android/app/src/main/java/com/nictunz/universalbacktester/BacktestForegroundService.java
          grep -q 'startPriorityLiveParityBacktest' android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          git diff --check
      - name: Commit integrated backtest wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/python/mobile_bridge.py \
                  android/app/src/main/java/com/nictunz/universalbacktester/BacktestForegroundService.java \
                  android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          git commit -m 'feat: run 5m and 15m as one priority backtest'
          git push origin HEAD:main
