name: Verify dual-timeframe Android relay
on:
  push:
    branches: [codex/priority-shadow-check]
    paths:
      - 'android/app/src/main/java/com/nictunz/universalbacktester/MobileMarketRelayService.java'
      - '.github/workflows/priority-relay-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test relay and signal boundary
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_mobile_relay.py tests/test_mobile_relay_dual.py tests/test_priority_signals.py -q
      - name: Sync shared Python sources
        run: |
          mkdir -p android/app/src/main/python/universal_bot
          cp -R universal_bot/. android/app/src/main/python/universal_bot/
          cp android/compat/config.py android/app/src/main/python/universal_bot/config.py
          cp android/compat/historical.py android/app/src/main/python/universal_bot/historical.py
      - name: Compile Android Java without publishing or deployment
        run: gradle -p android :app:compileDebugJavaWithJavac --stacktrace
