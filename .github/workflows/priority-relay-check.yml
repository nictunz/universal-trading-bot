name: Verify and build dual-timeframe Android relay
on:
  push:
    branches: [codex/priority-shadow-check]
    paths:
      - 'android/app/src/main/java/com/nictunz/universalbacktester/MobileMarketRelayService.java'
      - '.github/workflows/priority-relay-check.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test relay and signal boundary
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_mobile_relay.py tests/test_mobile_relay_dual.py tests/test_priority_signals.py -q
      - name: Sync shared Python sources
        run: |
          mkdir -p android/app/src/main/python/universal_bot
          cp -R universal_bot/. android/app/src/main/python/universal_bot/
          cp android/compat/config.py android/app/src/main/python/universal_bot/config.py
          cp android/compat/historical.py android/app/src/main/python/universal_bot/historical.py
      - name: Select candidate version above published releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const codes = releases.map(r => /^android-v(\d+)$/.exec(r.tag_name)).filter(Boolean).map(m => Number(m[1]));
            const runs = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 341262295, per_page: 1});
            const regular = 100000 + (runs.data.workflow_runs[0]?.run_number || 0);
            const code = Math.max(100000, regular, ...codes) + 1;
            core.exportVariable('ANDROID_VERSION_CODE', String(code));
            core.exportVariable('ANDROID_VERSION_NAME', '1.1.' + (code - 100000) + '-priority');
      - name: Build release candidate
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Sign candidate with existing update key
        env:
          RELAY_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELAY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELAY_KEYSTORE_B64" && test -n "$RELAY_STORE_PASSWORD"
          RELAY_KEYSTORE="$RUNNER_TEMP/priority-release.jks"
          trap 'rm -f "$RELAY_KEYSTORE"' EXIT
          printf '%s' "$RELAY_KEYSTORE_B64" | base64 --decode > "$RELAY_KEYSTORE"
          chmod 600 "$RELAY_KEYSTORE"
          export RELAY_KEY_PASSWORD="${RELAY_KEY_PASSWORD:-$RELAY_STORE_PASSWORD}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RELAY_KEYSTORE" --ks-key-alias "${RELAY_KEY_ALIAS:-universal}" \
            --ks-pass env:RELAY_STORE_PASSWORD --key-pass env:RELAY_KEY_PASSWORD \
            --out UniversalTradingBacktester-Android-priority.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose UniversalTradingBacktester-Android-priority.apk
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('UniversalTradingBacktester-Android-priority.apk')
          data = dict(commit=os.environ['GITHUB_SHA'], version_code=int(os.environ['ANDROID_VERSION_CODE']),
              version_name=os.environ['ANDROID_VERSION_NAME'], apk_name=apk.name,
              sha256=hashlib.sha256(apk.read_bytes()).hexdigest(), verified=True,
              scope='Android relay update only; does not deploy or activate server trading')
          Path('priority-android-manifest.json').write_text(json.dumps(data, indent=2))
          PY
      - name: Publish installable candidate release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const manifest = JSON.parse(fs.readFileSync('priority-android-manifest.json', 'utf8'));
            const apk = fs.readFileSync(manifest.apk_name);
            if (manifest.commit !== context.sha || !manifest.verified ||
                crypto.createHash('sha256').update(apk).digest('hex') !== manifest.sha256)
              throw new Error('Candidate manifest mismatch');
            const tag = 'priority-relay-' + context.runId;
            const release = (await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: 'Android ' + manifest.version_name + ' dual-timeframe relay',
              body: 'Signed relay candidate. Adds BTC 5m relay alongside existing 15m. Does not deploy or activate server trading. SHA-256: ' + manifest.sha256,
              draft: true, prerelease: true
            })).data;
            for (const name of [manifest.apk_name, 'priority-android-manifest.json']) {
              const data = fs.readFileSync(name);
              const asset = (await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              })).data;
              if (asset.size !== data.length) throw new Error('Asset size mismatch');
              if (asset.digest && asset.digest !== 'sha256:' + crypto.createHash('sha256').update(data).digest('hex'))
                throw new Error('Asset digest mismatch');
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'
            });
            core.info('CANDIDATE_RELEASE ' + release.html_url);
