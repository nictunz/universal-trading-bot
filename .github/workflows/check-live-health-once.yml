name: check-live-health-once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-live-health-once.yml'

permissions:
  contents: read

concurrency:
  group: check-live-health-once
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 5
    steps:
      - name: Authenticate and verify active LIVE runtime
        shell: bash
        run: |
          set -euo pipefail
          cd /home/kpj3669/universal-trading-bot
          /home/kpj3669/.cache/universal-trading-bot-dashboard-venv/bin/python - <<'PY'
          import json
          import time
          from pathlib import Path
          import requests
          from universal_bot.config import Settings

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          s = Settings()
          require(s.bot_mode.upper() == 'LIVE', 'Configured mode is not LIVE')
          relay = Path('/home/kpj3669/.cache/universal-trading-bot/mobile-market-relay.json')
          require(relay.is_file(), 'Mobile relay snapshot is missing')
          age = time.time() - relay.stat().st_mtime
          require(0 <= age <= 90, 'Mobile relay snapshot is stale or future-dated')
          base = 'http://127.0.0.1:8000'
          with requests.Session() as session:
              response = session.post(
                  base + '/login',
                  data={'username': s.dashboard_username, 'password': s.dashboard_password, 'next': '/'},
                  allow_redirects=False, timeout=10,
              )
              require(response.status_code == 303, 'Dashboard login failed')
              def get(path):
                  response = session.get(base + path, allow_redirects=False, timeout=30)
                  require(response.status_code == 200, 'Dashboard check failed: ' + path + ' HTTP ' + str(response.status_code))
                  return response.json()
              health = get('/health')
              ready = get('/api/live-readiness')
              state = get('/api/state')
              runtime = get('/api/runtime-info')
              strategy = get('/api/strategy-settings').get('values')
          require(health.get('status') == 'ok' and not health.get('errors') and not health.get('live_halted'), 'Runtime health is not OK')
          require(ready.get('ready') is True, 'LIVE readiness failed')
          require(any(c.get('name') == 'mode' and c.get('value') == 'LIVE' for c in ready.get('checks', [])), 'Readiness mode is not LIVE')
          require(ready.get('api_family') == 'classic-v2', 'Unexpected API family')
          require(runtime.get('source_matches_disk') is True, 'Running source differs from disk')
          saved = json.loads(Path('data/dashboard-strategy-settings.json').read_text(encoding='utf-8'))
          require(isinstance(strategy, dict) and bool(strategy) and saved == strategy, 'Saved strategy differs from active API settings')
          symbols = state.get('symbols') or []
          require(bool(symbols), 'Runtime has no symbols')
          summary = []
          for row in symbols:
              safety = row.get('live_safety') or {}
              require(not row.get('error'), 'Symbol runtime error')
              require(safety.get('enabled') is True and safety.get('halted') is False, 'LIVE safety is disabled or halted')
              require(safety.get('protection_ok') is True, 'Position protection check failed')
              flat = (safety.get('exchange_position') or {}).get('side') == 'FLAT'
              summary.append({'symbol': row.get('symbol'), 'timeframe': row.get('timeframe'),
                              'signal_reason': row.get('signal_reason'),
                              'protection': 'NOT_APPLICABLE_FLAT' if flat else 'PASS'})
          print(json.dumps({'health': 'ok', 'ready': True, 'mode': 'LIVE',
                            'relay_age_seconds': round(age, 1), 'settings_match': True,
                            'deployment_commit': runtime.get('deployment_commit'),
                            'symbols': summary}, ensure_ascii=False))
          PY
