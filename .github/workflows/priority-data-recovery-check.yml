name: Verify priority data auto recovery
on:
  pull_request:
    paths:
      - 'universal_bot/priority_runtime.py'
      - 'tests/test_priority_runtime_resilience.py'
      - 'tests/test_priority_runtime_auto_recovery.py'
      - '.github/workflows/priority-data-recovery-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile priority runtime
        run: python -m py_compile universal_bot/priority_runtime.py
      - name: Run priority recovery regression tests
        run: python -m pytest tests/test_priority_runtime_resilience.py tests/test_priority_runtime_auto_recovery.py tests/test_priority_signals.py -q
