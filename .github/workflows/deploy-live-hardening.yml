name: deploy-live-hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-live-hardening.yml'
  workflow_dispatch:

concurrency:
  group: deploy-live-hardening
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Include fail-closed preflight in the reviewed runtime and boot fingerprint.
      - name: Verify reviewed snapshot before deployment
        env:
          BOT_MODE: PAPER
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/reviewed-runtime-tests"
          "$RUNNER_TEMP/reviewed-runtime-tests/bin/python" -m pip install -q -e '.[dev]'
          "$RUNNER_TEMP/reviewed-runtime-tests/bin/python" -m compileall -q universal_bot scripts/deploy_reviewed_runtime.py
          "$RUNNER_TEMP/reviewed-runtime-tests/bin/python" -m pytest -q
      - name: Back up, deploy while flat, and verify actual runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/deploy_reviewed_runtime.py --source "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA"
