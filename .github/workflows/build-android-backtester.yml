# build-request: single-pass-signed-phone-build
name: Build Android Backtester APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-backtester.yml'
      - 'android/**'
      - 'universal_bot/local_cache_core.py'
      - 'universal_bot/archive_historical.py'
      - 'universal_bot/historical.py'
      - 'universal_bot/fast_backtest.py'
      - 'universal_bot/backtest_service.py'
      - 'universal_bot/providers/**'
      - 'universal_bot/adapters/**'
      - 'universal_bot/strategy/**'
      - 'universal_bot/config.py'
      - 'universal_bot/paper.py'
      - 'tests/**'
      - 'pyproject.toml'

concurrency:
  group: android-backtester-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare unzip compatibility
        shell: bash
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/android-tools-bin"
            UNZIP_WRAPPER="$RUNNER_TEMP/android-tools-bin/unzip"
            python - "$UNZIP_WRAPPER" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          target = Path(sys.argv[1])
          target.write_text("""#!/usr/bin/env python3
          import sys
          import zipfile

          args = sys.argv[1:]
          destination = "."
          if "-d" in args:
              index = args.index("-d")
              destination = args[index + 1]
              del args[index:index + 2]
          archives = [arg for arg in args if not arg.startswith("-")]
          if not archives:
              raise SystemExit("unzip wrapper: archive path is required")
          with zipfile.ZipFile(archives[0]) as bundle:
              bundle.extractall(destination)
          """, encoding="utf-8")
          target.chmod(0o755)
          PY
            echo "$RUNNER_TEMP/android-tools-bin" >> "$GITHUB_PATH"
          fi

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set monotonic app version
        shell: bash
        run: |
          echo "ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Verify Python project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q universal_bot
          pytest -q

      - name: Sync shared Python engine into Android app
        shell: bash
        run: |
          rm -rf android/app/src/main/python/universal_bot
          cp -R universal_bot android/app/src/main/python/universal_bot
          cp android/compat/config.py android/app/src/main/python/universal_bot/config.py
          cp android/compat/historical.py android/app/src/main/python/universal_bot/historical.py
          find android/app/src/main/python/universal_bot -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          echo 'Android compatibility modules applied'

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -o pipefail
          nice -n 15 gradle -p android :app:assembleRelease --stacktrace 2>&1 | tee android-build.log

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Android build failure report
        if: failure()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo '# Latest Android build failure'
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '~~~text'
            if [[ -f android-build.log ]]; then
              tail -n 300 android-build.log
            else
              echo 'android-build.log was not created; failure occurred before Gradle build.'
            fi
            echo '~~~'
          } > reports/latest-android-build-failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest-android-build-failure.md
          git commit -m 'ci: publish Android build failure [skip ci]' || exit 0
          git push origin HEAD:main

      - name: Prepare unsigned build artifact
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk UniversalTradingBacktester-Android-unsigned.apk
          ls -lh UniversalTradingBacktester-Android-unsigned.apk

      - name: Upload unsigned APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTradingBacktester-Android-unsigned
          path: UniversalTradingBacktester-Android-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure stable release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" ]]; then
            echo 'UPDATE_RELEASE_READY=false' >> "$GITHUB_ENV"
            echo 'Stable signing secrets are not configured; debug build is valid but no self-update release will be published.'
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/universal-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${KEY_ALIAS_SECRET:-universal}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo 'UPDATE_RELEASE_READY=true' >> "$GITHUB_ENV"

      - name: Sign stable update APK
        if: env.UPDATE_RELEASE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$UNSIGNED"
          "$APKSIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out UniversalTradingBacktester-Android.apk \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose UniversalTradingBacktester-Android.apk
          test -s UniversalTradingBacktester-Android.apk
          ls -lh UniversalTradingBacktester-Android.apk

      - name: Prepare signed update manifest
        if: env.UPDATE_RELEASE_READY == 'true'
        shell: bash
        run: |
          APK_SHA256="$(sha256sum UniversalTradingBacktester-Android.apk | awk '{print $1}')"
          export APK_SHA256
          python - <<'PY'
          import json, os
          data = {
              'schema_version': 1,
              'package_id': 'com.nictunz.universalbacktester',
              'version_code': int(os.environ['ANDROID_VERSION_CODE']),
              'version_name': os.environ['ANDROID_VERSION_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'apk_name': 'UniversalTradingBacktester-Android.apk',
              'sha256': os.environ['APK_SHA256'],
              'verified': True,
          }
          with open('android-update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps(data, ensure_ascii=False))
          PY

      - name: Configure private update server
        if: env.UPDATE_RELEASE_READY == 'true'
        shell: bash
        env:
          UPDATE_SSH_PRIVATE_KEY: ${{ secrets.ANDROID_UPDATE_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$UPDATE_SSH_PRIVATE_KEY" ]]; then
            echo 'UPDATE_SERVER_READY=false' >> "$GITHUB_ENV"
            echo 'Android update server SSH secret is not configured; signed build can be archived but not pushed to the phone update channel.'
            exit 0
          fi
          KEYFILE="$RUNNER_TEMP/android-update-ssh"
          printf '%s\n' "$UPDATE_SSH_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          mkdir -p "$HOME/.ssh"
          timeout 15 ssh-keyscan -T 10 -H 34.132.172.40 >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "ANDROID_UPDATE_SSH_KEYFILE=$KEYFILE" >> "$GITHUB_ENV"
          echo 'UPDATE_SERVER_READY=true' >> "$GITHUB_ENV"

      - name: Publish verified update to server
        if: env.UPDATE_RELEASE_READY == 'true' && env.UPDATE_SERVER_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          HOST=34.132.172.40
          USER=kpj3669
          REMOTE=/home/kpj3669/.cache/universal-trading-bot/android-updates
          SSH_OPTS=(-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          ssh "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SSH_KEYFILE" "$USER@$HOST" "mkdir -p '$REMOTE'"
          scp "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SSH_KEYFILE" UniversalTradingBacktester-Android.apk "$USER@$HOST:$REMOTE/UniversalTradingBacktester-Android.apk.uploading"
          scp "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SSH_KEYFILE" android-update.json "$USER@$HOST:$REMOTE/android-update.json.uploading"
          ssh "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SSH_KEYFILE" "$USER@$HOST" \
            "mv '$REMOTE/UniversalTradingBacktester-Android.apk.uploading' '$REMOTE/UniversalTradingBacktester-Android.apk' && mv '$REMOTE/android-update.json.uploading' '$REMOTE/android-update.json'"
          echo 'Verified Android update published to private SFTP channel.'

      - name: Upload signed update artifact
        if: env.UPDATE_RELEASE_READY == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTradingBacktester-Android-signed
          path: |
            UniversalTradingBacktester-Android.apk
            android-update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Android update release
        if: env.UPDATE_RELEASE_READY == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.ANDROID_VERSION_CODE }}
          name: Android ${{ env.ANDROID_VERSION_NAME }}
          body: Verified Android build for commit ${{ github.sha }}. Python tests, single-pass Android build, signing, and private update publication passed.
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            UniversalTradingBacktester-Android.apk
            android-update.json
