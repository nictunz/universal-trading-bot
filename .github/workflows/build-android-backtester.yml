# build-request: verified-rebuild-after-1.1.350-install-failure
name: Build Android Backtester APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-backtester.yml'
      - 'android/**'
      - 'universal_bot/**'
      - 'tests/**'
      - 'pyproject.toml'

concurrency:
  group: android-backtester-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -n "$SDKMANAGER"
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDKMANAGER" --licenses >/dev/null || true
          "$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set monotonic app version
        shell: bash
        run: |
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building $VERSION_NAME ($VERSION_CODE)"
      - name: Verify Python sources used by Android
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q universal_bot android/app/src/main/python
          test -f android/app/src/main/python/mobile_bridge.py
          test -f universal_bot/priority_backtest.py
          grep -q "run_priority_live_backtest" android/app/src/main/python/mobile_bridge.py
          grep -q "_resample_5m_to_15m" universal_bot/priority_backtest.py
      - name: Build unsigned release APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleRelease -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare unsigned build artifact
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"; test -f "$APK"; cp "$APK" "android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}-unsigned.apk"
      - name: Upload unsigned APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UniversalBacktester-${{ env.VERSION_NAME }}-unsigned
          path: android/app/build/outputs/apk/release/UniversalBacktester-${{ env.VERSION_NAME }}-unsigned.apk
          retention-days: 30
      - name: Configure stable release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}"; test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
          KEYSTORE="$RUNNER_TEMP/universal-update.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_UPDATE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_UPDATE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_UPDATE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-universal}" >> "$GITHUB_ENV"
          echo "ANDROID_UPDATE_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
      - name: Sign stable update APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"; SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"; ALIGNED="$RUNNER_TEMP/UniversalBacktester-${VERSION_NAME}-aligned.apk"; BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$ANDROID_UPDATE_KEYSTORE" --ks-key-alias "$ANDROID_UPDATE_KEY_ALIAS" --ks-pass "pass:$ANDROID_UPDATE_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_UPDATE_KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          keytool -printcert -jarfile "$SIGNED" | tee "$RUNNER_TEMP/android-signing-cert.txt"
          sha256sum "$SIGNED" | tee "$RUNNER_TEMP/android-apk-sha256.txt"
      - name: Prepare signed update manifest
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"
          ANDROID_UPDATE_APK_NAME="UniversalTradingBacktester-Android-${VERSION_CODE}.apk"
          cp "$SIGNED" "$ANDROID_UPDATE_APK_NAME"
          APK_SHA256="$(sha256sum "$ANDROID_UPDATE_APK_NAME" | awk '{print $1}')"
          echo "ANDROID_UPDATE_APK_NAME=$ANDROID_UPDATE_APK_NAME" >> "$GITHUB_ENV"
          export APK_SHA256 ANDROID_UPDATE_APK_NAME
          python - <<'PY'
          import json, os
          data = {
              'schema_version': 1,
              'package_id': 'com.nictunz.universalbacktester',
              'version_code': int(os.environ['VERSION_CODE']),
              'version_name': os.environ['VERSION_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'apk_name': os.environ['ANDROID_UPDATE_APK_NAME'],
              'sha256': os.environ['APK_SHA256'],
              'verified': True,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'android-update.json'), 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps(data, ensure_ascii=False))
          PY
      - name: Configure private update server
        shell: bash
        env:
          ANDROID_UPDATE_SSH_PRIVATE_KEY: ${{ secrets.ANDROID_UPDATE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_UPDATE_SSH_PRIVATE_KEY:-}"
          KEY="$RUNNER_TEMP/android-update-server-key"
          printf '%s\n' "$ANDROID_UPDATE_SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          mkdir -p "$HOME/.ssh"
          timeout 15 ssh-keyscan -T 10 -H 34.132.172.40 >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          echo "ANDROID_UPDATE_SERVER_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Publish verified update to server
        shell: bash
        run: |
          set -euo pipefail
          HOST=34.132.172.40
          USER=kpj3669
          REMOTE=/home/kpj3669/.cache/universal-trading-bot/android-updates
          SSH_OPTS=(-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          ssh "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SERVER_KEY" "$USER@$HOST" "mkdir -p '$REMOTE'"
          scp "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SERVER_KEY" "$ANDROID_UPDATE_APK_NAME" "$USER@$HOST:$REMOTE/$ANDROID_UPDATE_APK_NAME.uploading"
          scp "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SERVER_KEY" "$RUNNER_TEMP/android-update.json" "$USER@$HOST:$REMOTE/android-update.json.uploading"
          ssh "${SSH_OPTS[@]}" -i "$ANDROID_UPDATE_SERVER_KEY" "$USER@$HOST" "mv '$REMOTE/$ANDROID_UPDATE_APK_NAME.uploading' '$REMOTE/$ANDROID_UPDATE_APK_NAME' && mv '$REMOTE/android-update.json.uploading' '$REMOTE/android-update.json'"
          echo 'Verified Android update published to private SFTP channel.'
      - name: Upload signed update artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: UniversalBacktester-${{ env.VERSION_NAME }}-signed
          path: |
            android/app/build/outputs/apk/release/UniversalBacktester-${{ env.VERSION_NAME }}.apk
            ${{ runner.temp }}/android-update.json
            ${{ runner.temp }}/android-signing-cert.txt
            ${{ runner.temp }}/android-apk-sha256.txt
          retention-days: 30
      - name: Publish GitHub Android update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"; TAG="android-${VERSION_NAME}"
          gh release create "$TAG" "$SIGNED" "$RUNNER_TEMP/android-update.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "UniversalBacktester ${VERSION_NAME}" --notes "Stable signed Android update ${VERSION_NAME}. Source commit: ${GITHUB_SHA}."
