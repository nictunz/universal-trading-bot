# build-request: priority-routing-1.1.333
name: Build Android Backtester APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-backtester.yml'
      - 'android/**'
      - 'universal_bot/live_timeline.py'
      - 'universal_bot/local_cache_core.py'
      - 'universal_bot/archive_historical.py'
      - 'universal_bot/historical.py'
      - 'universal_bot/fast_backtest.py'
      - 'universal_bot/backtest.py'
      - 'universal_bot/backtest_engine.py'
      - 'universal_bot/indicators.py'
      - 'universal_bot/backtest_service.py'
      - 'universal_bot/providers/**'
      - 'universal_bot/adapters/**'
      - 'universal_bot/strategy/**'
      - 'universal_bot/config.py'
      - 'universal_bot/paper.py'
      - 'universal_bot/priority_signals.py'
      - 'tests/**'
      - 'pyproject.toml'

concurrency:
  group: android-backtester-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare unzip compatibility
        shell: bash
        run: |
          if ! command -v unzip >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/android-tools-bin"
            UNZIP_WRAPPER="$RUNNER_TEMP/android-tools-bin/unzip"
            python - "$UNZIP_WRAPPER" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          target = Path(sys.argv[1])
          target.write_text("""#!/usr/bin/env python3
          import sys
          import zipfile

          args = sys.argv[1:]
          destination = "."
          if "-d" in args:
              index = args.index("-d")
              if index + 1 < len(args):
                  destination = args[index + 1]
              del args[index:index + 2]
          archives = [arg for arg in args if not arg.startswith("-")]
          if not archives:
              raise SystemExit("usage: unzip archive.zip [-d destination]")
          with zipfile.ZipFile(archives[0]) as archive:
              archive.extractall(destination)
          """, encoding="utf-8")
          PY
            chmod +x "$UNZIP_WRAPPER"
            echo "$RUNNER_TEMP/android-tools-bin" >> "$GITHUB_PATH"
          fi

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set monotonic app version
        shell: bash
        run: |
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Verify Python project
        run: python -m compileall -q universal_bot android/app/src/main/python

      - name: Sync shared Python engine into Android app
        run: bash scripts/sync_android_python.sh

      - name: Build unsigned release APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Android build failure report
        if: steps.build_apk.outcome != 'success'
        shell: bash
        run: |
          mkdir -p reports
          {
            echo '# Android build failure'
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $VERSION_NAME ($VERSION_CODE)"
            echo
            echo '```text'
            tail -n 160 "$RUNNER_TEMP/android-build.log" || true
            echo '```'
          } > reports/android-build-failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/android-build-failure.md
          git commit -m "ci: record Android build failure for $VERSION_NAME" || true
          git push origin HEAD:main || true
          exit 1

      - name: Prepare unsigned build artifact
        if: steps.build_apk.outcome == 'success'
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          cp "$APK" "android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}-unsigned.apk"

      - name: Upload unsigned APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UniversalBacktester-${{ env.VERSION_NAME }}-unsigned
          path: android/app/build/outputs/apk/release/UniversalBacktester-${{ env.VERSION_NAME }}-unsigned.apk
          retention-days: 30

      - name: Configure stable release signing
        if: steps.build_apk.outcome == 'success'
        shell: bash
        env:
          ANDROID_UPDATE_KEYSTORE_B64: ${{ secrets.ANDROID_UPDATE_KEYSTORE_B64 }}
          ANDROID_UPDATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPDATE_KEYSTORE_PASSWORD }}
          ANDROID_UPDATE_KEY_ALIAS: ${{ secrets.ANDROID_UPDATE_KEY_ALIAS }}
          ANDROID_UPDATE_KEY_PASSWORD: ${{ secrets.ANDROID_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_UPDATE_KEYSTORE_B64:-}" ] || [ -z "${ANDROID_UPDATE_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_UPDATE_KEY_ALIAS:-}" ] || [ -z "${ANDROID_UPDATE_KEY_PASSWORD:-}" ]; then
            echo "Stable Android update signing secrets are not configured." >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/universal-update.jks"
          printf '%s' "$ANDROID_UPDATE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_UPDATE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Sign stable update APK
        if: steps.build_apk.outcome == 'success'
        shell: bash
        env:
          ANDROID_UPDATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPDATE_KEYSTORE_PASSWORD }}
          ANDROID_UPDATE_KEY_ALIAS: ${{ secrets.ANDROID_UPDATE_KEY_ALIAS }}
          ANDROID_UPDATE_KEY_PASSWORD: ${{ secrets.ANDROID_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"
          ALIGNED="$RUNNER_TEMP/UniversalBacktester-${VERSION_NAME}-aligned.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$ANDROID_UPDATE_KEYSTORE" \
            --ks-key-alias "$ANDROID_UPDATE_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_UPDATE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_UPDATE_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          keytool -printcert -jarfile "$SIGNED" | tee "$RUNNER_TEMP/android-signing-cert.txt"
          sha256sum "$SIGNED" | tee "$RUNNER_TEMP/android-apk-sha256.txt"

      - name: Prepare signed update manifest
        if: steps.build_apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"
          SHA256=$(sha256sum "$SIGNED" | awk '{print $1}')
          cat > "$RUNNER_TEMP/android-update.json" <<JSON
          {
            "version_name": "$VERSION_NAME",
            "version_code": $VERSION_CODE,
            "sha256": "$SHA256",
            "file_name": "UniversalBacktester-${VERSION_NAME}.apk",
            "source_commit": "$GITHUB_SHA"
          }
          JSON
          cat "$RUNNER_TEMP/android-update.json"

      - name: Configure private update server
        if: steps.build_apk.outcome == 'success'
        shell: bash
        env:
          ANDROID_UPDATE_SSH_PRIVATE_KEY: ${{ secrets.ANDROID_UPDATE_SSH_PRIVATE_KEY }}
          ANDROID_UPDATE_SERVER_HOST: ${{ secrets.ANDROID_UPDATE_SERVER_HOST }}
          ANDROID_UPDATE_SERVER_USER: ${{ secrets.ANDROID_UPDATE_SERVER_USER }}
          ANDROID_UPDATE_SERVER_PORT: ${{ secrets.ANDROID_UPDATE_SERVER_PORT }}
          ANDROID_UPDATE_SERVER_PATH: ${{ secrets.ANDROID_UPDATE_SERVER_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_UPDATE_SSH_PRIVATE_KEY:-}" ] || [ -z "${ANDROID_UPDATE_SERVER_HOST:-}" ] || [ -z "${ANDROID_UPDATE_SERVER_USER:-}" ] || [ -z "${ANDROID_UPDATE_SERVER_PATH:-}" ]; then
            echo "Private Android update server secrets are not configured." >&2
            exit 1
          fi
          KEY="$RUNNER_TEMP/android-update-server-key"
          printf '%s\n' "$ANDROID_UPDATE_SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "ANDROID_UPDATE_SERVER_KEY=$KEY" >> "$GITHUB_ENV"
          echo "ANDROID_UPDATE_SERVER_PORT_EFFECTIVE=${ANDROID_UPDATE_SERVER_PORT:-22}" >> "$GITHUB_ENV"

      - name: Publish verified update to server
        if: steps.build_apk.outcome == 'success'
        shell: bash
        env:
          ANDROID_UPDATE_SERVER_HOST: ${{ secrets.ANDROID_UPDATE_SERVER_HOST }}
          ANDROID_UPDATE_SERVER_USER: ${{ secrets.ANDROID_UPDATE_SERVER_USER }}
          ANDROID_UPDATE_SERVER_PATH: ${{ secrets.ANDROID_UPDATE_SERVER_PATH }}
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"
          PORT="$ANDROID_UPDATE_SERVER_PORT_EFFECTIVE"
          DEST="${ANDROID_UPDATE_SERVER_USER}@${ANDROID_UPDATE_SERVER_HOST}"
          ssh -i "$ANDROID_UPDATE_SERVER_KEY" -p "$PORT" -o StrictHostKeyChecking=accept-new "$DEST" \
            "mkdir -p '$ANDROID_UPDATE_SERVER_PATH'"
          scp -i "$ANDROID_UPDATE_SERVER_KEY" -P "$PORT" -o StrictHostKeyChecking=accept-new \
            "$SIGNED" "$DEST:$ANDROID_UPDATE_SERVER_PATH/UniversalBacktester-${VERSION_NAME}.apk"
          scp -i "$ANDROID_UPDATE_SERVER_KEY" -P "$PORT" -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/android-update.json" "$DEST:$ANDROID_UPDATE_SERVER_PATH/android-update.json"

      - name: Upload signed update artifact
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UniversalBacktester-${{ env.VERSION_NAME }}-signed
          path: |
            android/app/build/outputs/apk/release/UniversalBacktester-${{ env.VERSION_NAME }}.apk
            ${{ runner.temp }}/android-update.json
            ${{ runner.temp }}/android-signing-cert.txt
            ${{ runner.temp }}/android-apk-sha256.txt
          retention-days: 30

      - name: Publish GitHub Android update release
        if: steps.build_apk.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNED="android/app/build/outputs/apk/release/UniversalBacktester-${VERSION_NAME}.apk"
          TAG="android-${VERSION_NAME}"
          gh release create "$TAG" "$SIGNED" "$RUNNER_TEMP/android-update.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "UniversalBacktester ${VERSION_NAME}" \
            --notes "Stable signed Android update ${VERSION_NAME}. Source commit: ${GITHUB_SHA}."
