name: fixed-parameter-backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixed-parameter-backtest.yml'

concurrency:
  group: fixed-parameter-backtest-btc-15m
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  CI_VENV: /home/kpj3669/.cache/universal-trading-bot-ci-venv

jobs:
  backtest:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runtime
        run: |
          set -euo pipefail
          if [[ ! -x "$CI_VENV/bin/python" ]]; then
            python3 -m venv "$CI_VENV"
          fi
          "$CI_VENV/bin/pip" install -e .

      - name: Run exact Android-engine backtest
        run: |
          set -euo pipefail
          mkdir -p fixed-backtest
          "$CI_VENV/bin/python" - <<'PY' 2>&1 | tee fixed-backtest/run.log
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from universal_bot.local_cache_core import build_cache_and_backtest

          symbol = "BTC/USDT:USDT"
          timeframe = "15m"
          start = "2025-09-01"
          end = "2026-08-31"
          output_dir = Path.home() / ".cache" / "universal-trading-bot"
          overrides = {
              "volume_lookback": 80,
              "volume_break_multiplier": 6.0,
              "min_one_bar_vol": 0.1,
              "max_one_bar_vol": 2.4,
              "volatility_bars": 24,
              "tp_vol_multiplier": 2.4,
              "sl_vol_multiplier": 0.6,
              "min_tp_percent": 0.3,
              "max_tp_percent": 2.1,
              "min_sl_percent": 0.5,
              "max_sl_percent": 1.0,
              "use_nbar_volatility_block": True,
              "nbar_volatility_bars": 200,
              "max_nbar_volatility": 7.3,
              "use_adx_filter": False,
              "adx_length": 7,
              "adx_min": 11.2,
              "adx_max": 73.7,
              "use_rsi_filter": True,
              "rsi_length": 6,
              "rsi_oversold_min": 17.4,
              "rsi_oversold_max": 41.8,
              "rsi_overbought_min": 72.4,
              "rsi_overbought_max": 83.6,
              "allow_long": True,
              "allow_short": True,
              "first_entry_consecutive_candles": 1,
              "apply_consecutive_candles_to_all_entries": False,
              "max_pyramiding": 1,
              "cooldown_bars": 35,
              "reentry_bars": 7,
              "block_weekend": False,
              "excluded_hours": "",
              "order_percent_of_equity": 500.0,
              "initial_capital": 1000.0,
              "leverage": 50,
              "backtest_fee_percent": 0.02,
              "backtest_slippage_percent": 0.01,
              "backtest_margin_mode": "crossed",
              "backtest_maintenance_margin_percent": 0.5,
              "backtest_cross_liquidation_buffer_percent": 25.0,
              "backtest_max_total_multiplier": 15.0,
              "backtest_compounding_enabled": True,
              "backtest_execution_model": "next_open",
              "adaptive_regime_enabled": True,
          }

          def log(message):
              print(message, flush=True)

          database, result_path, summary = build_cache_and_backtest(
              symbol,
              timeframe,
              start,
              end,
              output_dir,
              log,
              strategy_overrides=overrides,
          )
          payload = dict(summary)
          payload["name"] = "BTC 15m 고수익형"
          payload["parameters"] = overrides
          payload["run_requested_at"] = datetime.now(timezone.utc).isoformat()
          payload["source_result"] = str(result_path)
          payload["database"] = str(database)
          Path("fixed-backtest/result.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          report = "\n".join([
              "# BTC 15m 고수익형 고정 파라미터 백테스트",
              "",
              f"- 기간: {start} ~ {end}",
              f"- 봉 수: {summary.get('bars')}",
              f"- 거래 수: {summary.get('trades')}",
              f"- 승리 거래: {summary.get('wins')}",
              f"- 승률: {float(summary.get('win_rate') or 0):.2f}%",
              f"- Profit Factor: {float(summary.get('profit_factor') or 0):.4f}",
              f"- 순손익: {float(summary.get('pnl') or 0):.2f} USDT",
              f"- 수익률: {float(summary.get('return_percent') or 0):.2f}%",
              f"- MDD: {float(summary.get('max_drawdown_percent') or 0):.2f}%",
              f"- 청산 횟수: {int(summary.get('liquidations') or 0)}",
              f"- 체결 모델: {summary.get('execution_model')}",
              f"- 캐시 SHA256: {summary.get('cache_sha256')}",
              "",
              "> 앱 Universal Vector Engine과 동일한 캐시/백테스트 경로로 실행.",
              "",
          ])
          Path("fixed-backtest/result.md").write_text(report, encoding="utf-8")
          print("FIXED_BACKTEST_RESULT=" + json.dumps({
              key: summary.get(key) for key in (
                  "bars", "trades", "wins", "win_rate", "profit_factor", "pnl",
                  "return_percent", "max_drawdown_percent", "liquidations",
                  "data_start", "data_end", "execution_model", "cache_sha256",
              )
          }, ensure_ascii=False))
          PY

      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: btc-15m-fixed-parameter-backtest
          path: fixed-backtest/
          retention-days: 30

      - name: Publish result report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B fixed-backtest-report origin/main
          mkdir -p reports
          cp fixed-backtest/result.json reports/latest-fixed-parameter-backtest.json
          cp fixed-backtest/result.md reports/latest-fixed-parameter-backtest.md
          git add reports/latest-fixed-parameter-backtest.json reports/latest-fixed-parameter-backtest.md
          git commit -m 'results: publish BTC 15m fixed backtest [skip ci]'
          git push origin HEAD:main
