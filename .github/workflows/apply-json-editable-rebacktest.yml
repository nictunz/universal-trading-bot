name: Apply editable JSON rebacktest UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-json-editable-rebacktest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch MainActivity
        run: python scripts/apply_json_editable_rebacktest.py
      - name: Verify patch markers
        run: |
          grep -n "선택/JSON 전략 수치 직접 수정" android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          grep -n "saveSelectedStrategyEdits" android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          grep -n "저장 후 재백테스트" android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          git commit -m 'feat: edit imported JSON values before rebacktest'
          git push origin HEAD:main
