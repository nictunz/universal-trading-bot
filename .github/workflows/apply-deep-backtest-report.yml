name: Apply Deep Backtest Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-deep-backtest-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainActivity
        shell: python
        run: |
          from pathlib import Path

          p = Path('android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java')
          s = p.read_text()

          # 1) Field
          field_anchor = '    private Button chartButton;\n'
          if 'private Button deepBacktestButton;' not in s:
              if field_anchor not in s:
                  raise SystemExit('chartButton field anchor not found')
              s = s.replace(
                  field_anchor,
                  field_anchor + '    private Button deepBacktestButton;\n',
                  1,
              )

          # 2) Result action button. Use a single stable line as the anchor so UI
          #    text/indentation changes do not break this workflow.
          if 'deepBacktestButton.setOnClickListener' not in s:
              button_anchor = '        resultActions.addView(chartButton, marginTop(6));\n'
              if button_anchor not in s:
                  raise SystemExit('chartButton addView anchor not found')
              button_insert = button_anchor + (
                  '        deepBacktestButton = actionButton("📊 딥백테스트 리포트", PRIMARY);\n'
                  '        deepBacktestButton.setOnClickListener(v -> showDeepBacktestReport());\n'
                  '        resultActions.addView(deepBacktestButton, marginTop(6));\n'
              )
              s = s.replace(button_anchor, button_insert, 1)

          # 3) Activity launcher method
          if 'private void showDeepBacktestReport()' not in s:
              method_anchor = '    private void enableResultActions(boolean enabled) {\n'
              if method_anchor not in s:
                  raise SystemExit('enableResultActions anchor not found')
              method = '''    private void showDeepBacktestReport() {
              if (lastSummary == null) {
                  toast("백테스트를 먼저 실행하세요.");
                  return;
              }
              Intent intent = new Intent(this, DeepBacktestReportActivity.class);
              intent.putExtra("summary_json", lastSummary.toString());
              startActivity(intent);
          }

          '''
              s = s.replace(method_anchor, method + method_anchor, 1)

          # 4) Enable/disable array. Support both the original array and already
          #    expanded variants without treating harmless UI changes as failure.
          old_array = '        Button[] buttons = {resultSummaryButton, tradeHistoryButton, chartButton};'
          new_array = '        Button[] buttons = {resultSummaryButton, tradeHistoryButton, chartButton, deepBacktestButton};'
          if old_array in s:
              s = s.replace(old_array, new_array, 1)

          p.write_text(s)

      - name: Verify patch
        run: |
          grep -q 'private Button deepBacktestButton' android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          grep -q 'deepBacktestButton.setOnClickListener' android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          grep -q 'private void showDeepBacktestReport()' android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          grep -q 'DeepBacktestReportActivity' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/nictunz/universalbacktester/DeepBacktestReportActivity.java

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/nictunz/universalbacktester/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Already patched.'
            exit 0
          fi
          git commit -m 'feat(android): add deep backtest report entry point'
          git push origin HEAD:main
