name: optimize-one-year-strategy

on:
  workflow_dispatch:
    inputs:
      trials:
        description: Total deterministic trials per market
        required: false
        default: '300'

concurrency:
  group: optimize-one-year-strategy
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  CI_VENV: /home/kpj3669/.cache/universal-trading-bot-ci-venv

jobs:
  eth_batches:
    name: ETH trials ${{ matrix.start }}-${{ matrix.end }}
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { start: 1, end: 75 }
          - { start: 76, end: 150 }
          - { start: 151, end: 225 }
          - { start: 226, end: 300 }
    steps:
      - uses: actions/checkout@v5
      - name: Prepare runtime
        run: |
          set -euo pipefail
          if [[ ! -x "$CI_VENV/bin/python" ]]; then python3 -m venv "$CI_VENV"; fi
          "$CI_VENV/bin/pip" install -e .
      - name: Optimize ETH batch
        run: |
          set -euo pipefail
          mkdir -p batch
          "$CI_VENV/bin/python" scripts/optimize_one_year_strategy.py \
            --symbol ETH/USDT:USDT --timeframe 5m --trials 300 \
            --start-trial "${{ matrix.start }}" --end-trial "${{ matrix.end }}" \
            --output "batch/eth-${{ matrix.start }}-${{ matrix.end }}.json" \
            2>&1 | tee "batch/eth-${{ matrix.start }}-${{ matrix.end }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-batch-${{ matrix.start }}
          path: batch/eth-${{ matrix.start }}-${{ matrix.end }}.*
          retention-days: 7

  eth_aggregate:
    name: Aggregate all ETH trials
    needs: eth_batches
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: eth-batch-*
          merge-multiple: true
          path: batches/eth
      - name: Merge and verify ETH 1-300
        run: |
          set -euo pipefail
          mkdir -p final
          python3 scripts/aggregate_strategy_optimization.py \
            --input-dir batches/eth --symbol ETH/USDT:USDT --timeframe 5m \
            --trials 300 --output final/latest-strategy-optimization-eth.json
      - uses: actions/upload-artifact@v4
        with:
          name: eth-final
          path: final/latest-strategy-optimization-eth.json
          retention-days: 7

  btc_batches:
    name: BTC trials ${{ matrix.start }}-${{ matrix.end }}
    needs: eth_aggregate
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { start: 1, end: 75 }
          - { start: 76, end: 150 }
          - { start: 151, end: 225 }
          - { start: 226, end: 300 }
    steps:
      - uses: actions/checkout@v5
      - name: Prepare runtime
        run: |
          set -euo pipefail
          if [[ ! -x "$CI_VENV/bin/python" ]]; then python3 -m venv "$CI_VENV"; fi
          "$CI_VENV/bin/pip" install -e .
      - name: Optimize BTC batch
        run: |
          set -euo pipefail
          mkdir -p batch
          "$CI_VENV/bin/python" scripts/optimize_one_year_strategy.py \
            --symbol BTC/USDT:USDT --timeframe 5m --trials 300 \
            --start-trial "${{ matrix.start }}" --end-trial "${{ matrix.end }}" \
            --output "batch/btc-${{ matrix.start }}-${{ matrix.end }}.json" \
            2>&1 | tee "batch/btc-${{ matrix.start }}-${{ matrix.end }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-batch-${{ matrix.start }}
          path: batch/btc-${{ matrix.start }}-${{ matrix.end }}.*
          retention-days: 7

  finalize:
    name: Aggregate BTC and publish both markets
    needs: [eth_aggregate, btc_batches]
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: eth-final
          path: stage/eth
      - uses: actions/download-artifact@v4
        with:
          pattern: btc-batch-*
          merge-multiple: true
          path: stage/btc
      - name: Merge BTC and write reports
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/aggregate_strategy_optimization.py \
            --input-dir stage/btc --symbol BTC/USDT:USDT --timeframe 5m \
            --trials 300 --output reports/latest-strategy-optimization-btc.json
          cp stage/eth/latest-strategy-optimization-eth.json reports/latest-strategy-optimization-eth.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def markdown(data):
              b=data['best']; r=b['result']; p=b['parameters']; a=data['execution_assumptions']
              return '\n'.join([
                  f"# {data['symbol']} one-year strategy optimization", "",
                  f"- Generated UTC: {data['generated_at']}",
                  f"- Market: {data['symbol']} {data['timeframe']}",
                  f"- Trials fully merged: {data['trials_executed']}", "",
                  "## Execution assumptions", "",
                  f"- Initial capital: {a['initial_capital_usdt']} USDT",
                  f"- Entry notional: {a['entry_multiplier_range'][0]}x to {a['entry_multiplier_range'][1]}x equity",
                  f"- Exchange leverage: {a['exchange_leverage']}x",
                  f"- Maximum entries: {a['max_entries_range'][0]} to {a['max_entries_range'][1]}",
                  f"- Fee: {a['fee_percent_per_side']}% per side",
                  f"- Slippage: {a['slippage_percent_per_side']}% per side", "",
                  "## Best result", "",
                  f"- Trial: {b['trial']}",
                  f"- Entry multiplier: {p['entry_multiplier']}x",
                  f"- Maximum entries: {p['max_pyramiding']}",
                  f"- Net PnL: {r['pnl']} USDT",
                  f"- Return: {r['return_percent']}%",
                  f"- Profit factor: {r['profit_factor']}",
                  f"- Win rate: {r['win_rate']}%",
                  f"- Max drawdown: {r['max_drawdown_percent']}%",
                  f"- Trades: {r['trades']}", "",
                  "## Parameters", "", "```json",
                  json.dumps(p, ensure_ascii=False, indent=2), "```", "",
                  "> Research only. Not automatically applied to PAPER or LIVE.", ""
              ])
          markets={}
          for slug in ("eth", "btc"):
              p=Path(f"reports/latest-strategy-optimization-{slug}.json")
              d=json.loads(p.read_text())
              markets[slug]=d
              Path(f"reports/latest-strategy-optimization-{slug}.md").write_text(markdown(d))
          combined={
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "markets": markets,
              "warning": "Research only. Not automatically applied to PAPER or LIVE."
          }
          Path("reports/latest-strategy-optimization.json").write_text(json.dumps(combined,ensure_ascii=False,indent=2)+"\n")
          Path("reports/latest-strategy-optimization.md").write_text(
              "# ETH and BTC one-year strategy optimization\n\n" +
              "## ETH\n\n" + markdown(markets["eth"]) +
              "\n## BTC\n\n" + markdown(markets["btc"])
          )
          PY
      - name: Publish synchronized reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-strategy-optimization*.json reports/latest-strategy-optimization*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: publish ETH and BTC optimization [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Failed to publish reports after 5 synchronized attempts" >&2
          exit 1
