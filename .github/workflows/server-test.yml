name: server-verification

on:
  workflow_dispatch:
    inputs:
      run_backtest:
        description: Run the offline ETH/USDT 5m backtest
        required: false
        default: true
        type: boolean
      benchmark:
        description: Run performance benchmark
        required: false
        default: true
        type: boolean

# This workflow is intentionally manual. The self-hosted runner is the user's
# trading server, so no push/PR should execute arbitrary code there.
permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 30
    env:
      BOT_MODE: PAPER
      PYTHONUNBUFFERED: "1"
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime information
        run: |
          set -euo pipefail
          echo "===== HOST ====="
          hostname
          uname -a
          echo "===== PYTHON ====="
          python3 --version
          echo "===== GIT ====="
          git rev-parse --short HEAD
          git status --short

      - name: Prepare virtual environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python -m compileall -q universal_bot

      - name: Tests
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          pytest -q

      - name: Backtest
        if: ${{ inputs.run_backtest }}
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python -m universal_bot.backtest --symbol ETH/USDT:USDT --exchange bitget --timeframe 5m --start 2024-01-01

      - name: Benchmark
        if: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          if [ -f scripts/benchmark_backtest.py ]; then
            python scripts/benchmark_backtest.py
          else
            echo 'benchmark script not present; running import/indicator smoke benchmark'
            python - <<'PY'
          import time
          import numpy as np
          import pandas as pd
          from universal_bot.indicators import compute_indicators
          n = 100_000
          idx = pd.date_range('2024-01-01', periods=n, freq='5min', tz='UTC')
          close = pd.Series(np.linspace(2000, 2500, n), index=idx)
          df = pd.DataFrame({'open': close, 'high': close + 2, 'low': close - 2, 'close': close, 'volume': 1000.0}, index=idx)
          t = time.perf_counter()
          compute_indicators(df)
          print(f'indicator_100k_bars_seconds={time.perf_counter()-t:.4f}')
          PY
          fi
