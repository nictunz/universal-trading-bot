name: server-verification

on:
  push:
    branches: [main]
    paths:
      - 'universal_bot/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/server-test.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      run_backtest:
        description: Run the rolling one-year ETH/USDT 5m backtest
        required: false
        default: true
        type: boolean
      benchmark:
        description: Run performance benchmarks
        required: false
        default: true
        type: boolean

concurrency:
  group: server-verification
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 45
    env:
      BOT_MODE: PAPER
      PYTHONUNBUFFERED: "1"
      CI: "1"
      CI_VENV: /home/kpj3669/.cache/universal-trading-bot-ci-venv
      DATABASE_URL: sqlite:////home/kpj3669/.cache/universal-trading-bot/historical.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime information
        id: runtime
        run: |
          set -euo pipefail
          mkdir -p .verification "$(dirname "${DATABASE_URL#sqlite:///}")"
          {
            echo "host=$(hostname)"
            echo "kernel=$(uname -a)"
            echo "python=$(python3 --version 2>&1)"
            echo "commit=$(git rev-parse HEAD)"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "database_url=$DATABASE_URL"
          } | tee .verification/runtime.txt

      - name: Prepare virtual environment
        id: prepare
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -x "$CI_VENV/bin/python" ]]; then
            mkdir -p "$(dirname "$CI_VENV")"
            python3 -m venv "$CI_VENV"
            "$CI_VENV/bin/python" -m pip install --upgrade pip
          fi
          "$CI_VENV/bin/pip" install -e ".[dev]" 2>&1 | tee .verification/install.log

      - name: Compile
        id: compile
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m compileall -q universal_bot scripts 2>&1 | tee .verification/compile.log

      - name: Tests
        id: tests
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CI_VENV/bin/pytest" -q 2>&1 | tee .verification/tests.log

      - name: Dashboard HTTP smoke
        id: dashboard
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" scripts/dashboard_smoke.py > .verification/dashboard_server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          "$CI_VENV/bin/python" - <<'PY' 2>&1 | tee .verification/dashboard.log
          import json, time, urllib.request
          base = 'http://127.0.0.1:8765'
          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base + '/health', timeout=2) as r:
                      health = json.load(r)
                  with urllib.request.urlopen(base + '/', timeout=2) as r:
                      html = r.read().decode('utf-8')
                  with urllib.request.urlopen(base + '/api/state', timeout=2) as r:
                      state = json.load(r)
                  assert health['status'] == 'ok', health
                  assert 'LIVE READINESS' in html
                  assert '수수료/슬리피지' in html
                  assert state['symbols'][0]['symbol'] == 'ETH/USDT:USDT'
                  print(json.dumps({'health': health, 'html_bytes': len(html), 'state_symbols': len(state['symbols'])}, ensure_ascii=False))
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(0.5)
          else:
              raise RuntimeError(f'dashboard smoke failed: {last}')
          PY

      - name: Bitget public capability check
        id: bitget_public
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" scripts/verify_bitget_public.py 2>&1 | tee .verification/bitget_public.log

      - name: Backtest
        id: backtest
        if: ${{ steps.prepare.outcome == 'success' && (github.event_name == 'push' || inputs.run_backtest) }}
        continue-on-error: true
        run: |
          set -uo pipefail
          start_date=$(date -u -d '1 year ago' +%F)
          end_date=$(date -u +%F)
          echo "backtest_range=${start_date}..${end_date}" | tee .verification/backtest_range.txt
          start_ts=$(date +%s)
          "$CI_VENV/bin/python" scripts/server_verify_backtest.py \
            --symbol ETH/USDT:USDT --exchange bitget --timeframe 5m \
            --start "$start_date" --end "$end_date" \
            2>&1 | tee .verification/backtest.log
          rc=${PIPESTATUS[0]}
          end_ts=$(date +%s)
          echo "wall_seconds=$((end_ts-start_ts))" > .verification/backtest_time.txt
          exit "$rc"

      - name: Performance benchmarks
        id: benchmark
        if: ${{ steps.prepare.outcome == 'success' && (github.event_name == 'push' || inputs.benchmark) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" - <<'PY' 2>&1 | tee .verification/benchmark.log
          import time
          import numpy as np
          import pandas as pd
          from universal_bot.backtest import run_backtest
          from universal_bot.config import Settings
          from universal_bot.indicators import dmi_adx, rsi, rolling_range_percent, sma

          n = 100_000
          idx = pd.date_range('2024-01-01', periods=n, freq='5min', tz='UTC')
          close = pd.Series(2000 + np.linspace(0, 500, n) + np.sin(np.arange(n) / 17), index=idx)
          open_ = close.shift(1).fillna(close.iloc[0])
          high = pd.concat([open_, close], axis=1).max(axis=1) + 2.0
          low = pd.concat([open_, close], axis=1).min(axis=1) - 2.0
          volume = pd.Series(1000.0 + (np.arange(n) % 97), index=idx)
          t = time.perf_counter()
          sma(volume, 70); rolling_range_percent(high, low, 288); rolling_range_percent(high, low, 200); dmi_adx(high, low, close, 14); rsi(close, 8)
          print(f'indicator_100k_bars_seconds={time.perf_counter()-t:.4f}')
          df = pd.DataFrame({'open': open_, 'high': high, 'low': low, 'close': close, 'volume': volume})
          settings = Settings(bot_mode='PAPER', use_start_date=False, use_four_crypto_exchanges=False, use_nbar_volatility_block=False, volume_break_multiplier=999.0)
          t = time.perf_counter(); result = run_backtest(df, settings)
          print(f'cached_strategy_100k_bars_seconds={time.perf_counter()-t:.4f}')
          print(f'cached_strategy_100k_trades={result.trades}')
          PY

      - name: Publish verification report
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DASHBOARD_OUTCOME: ${{ steps.dashboard.outcome }}
          BITGET_PUBLIC_OUTCOME: ${{ steps.bitget_public.outcome }}
          BACKTEST_OUTCOME: ${{ steps.backtest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          set -euo pipefail
          TMP_REPORT=$(mktemp)
          {
            echo "# Latest self-hosted server verification"
            echo
            echo "- Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Runner: $(hostname)"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- BOT_MODE: PAPER"
            echo
            echo "## Outcomes"
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Prepare | ${PREPARE_OUTCOME:-not-run} |"
            echo "| Compile | ${COMPILE_OUTCOME:-not-run} |"
            echo "| Pytest | ${TESTS_OUTCOME:-not-run} |"
            echo "| Dashboard HTTP smoke | ${DASHBOARD_OUTCOME:-not-run} |"
            echo "| Bitget public capabilities | ${BITGET_PUBLIC_OUTCOME:-not-run} |"
            echo "| ETH/USDT 5m one-year backtest | ${BACKTEST_OUTCOME:-not-run} |"
            echo "| Performance benchmarks | ${BENCHMARK_OUTCOME:-not-run} |"
            echo
            echo "## Runtime"; echo '```text'; cat .verification/runtime.txt 2>/dev/null || true; echo '```'
            echo; echo "## Pytest"; echo '```text'; tail -n 120 .verification/tests.log 2>/dev/null || true; echo '```'
            echo; echo "## Dashboard HTTP smoke"; echo '```text'; cat .verification/dashboard.log 2>/dev/null || true; tail -n 30 .verification/dashboard_server.log 2>/dev/null || true; echo '```'
            echo; echo "## Bitget public capabilities"; echo '```text'; cat .verification/bitget_public.log 2>/dev/null || true; echo '```'
            echo; echo "## Backtest"; echo '```text'; cat .verification/backtest_range.txt 2>/dev/null || true; cat .verification/backtest_time.txt 2>/dev/null || true; tail -n 180 .verification/backtest.log 2>/dev/null || true; echo '```'
            echo; echo "## Performance benchmarks"; echo '```text'; cat .verification/benchmark.log 2>/dev/null || true; echo '```'
            echo; echo "## Install/compile diagnostics"; echo '```text'; tail -n 80 .verification/install.log 2>/dev/null || true; tail -n 80 .verification/compile.log 2>/dev/null || true; echo '```'
          } > "$TMP_REPORT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B verification-report origin/main
          mkdir -p reports
          cp "$TMP_REPORT" reports/latest-server-verification.md
          git add reports/latest-server-verification.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: update server verification report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DASHBOARD_OUTCOME: ${{ steps.dashboard.outcome }}
          BITGET_PUBLIC_OUTCOME: ${{ steps.bitget_public.outcome }}
          BACKTEST_OUTCOME: ${{ steps.backtest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$PREPARE_OUTCOME" "$COMPILE_OUTCOME" "$TESTS_OUTCOME" "$DASHBOARD_OUTCOME" "$BITGET_PUBLIC_OUTCOME" "$BACKTEST_OUTCOME" "$BENCHMARK_OUTCOME"; do
            if [[ "$outcome" == "failure" ]]; then
              echo "Verification failed; see reports/latest-server-verification.md"
              exit 1
            fi
          done
          echo "All executed verification checks passed."
