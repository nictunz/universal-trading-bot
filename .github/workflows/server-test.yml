name: server-verification

on:
  workflow_dispatch:
    inputs:
      run_backtest:
        description: Run the offline ETH/USDT 5m backtest
        required: false
        default: true
        type: boolean
      benchmark:
        description: Run performance benchmark
        required: false
        default: true
        type: boolean

# Manual only: this runner is the user's trading server.
permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 45
    env:
      BOT_MODE: PAPER
      PYTHONUNBUFFERED: "1"
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime information
        run: |
          set -euo pipefail
          echo "===== HOST ====="
          hostname
          uname -a
          echo "===== PYTHON ====="
          python3 --version
          echo "===== GIT ====="
          git rev-parse --short HEAD
          git status --short

      - name: Prepare virtual environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python -m compileall -q universal_bot

      - name: Tests
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          pytest -q

      - name: Backtest
        if: ${{ inputs.run_backtest }}
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python scripts/server_verify_backtest.py --symbol ETH/USDT:USDT --exchange bitget --timeframe 5m --start 2024-01-01

      - name: Indicator benchmark
        if: ${{ inputs.benchmark }}
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python - <<'PY'
          import time
          import numpy as np
          import pandas as pd
          from universal_bot.indicators import dmi_adx, rsi, rolling_range_percent, sma

          n = 100_000
          idx = pd.date_range('2024-01-01', periods=n, freq='5min', tz='UTC')
          close = pd.Series(np.linspace(2000, 2500, n), index=idx)
          high = close + 2.0
          low = close - 2.0
          volume = pd.Series(1000.0, index=idx)
          t = time.perf_counter()
          sma(volume, 20)
          rolling_range_percent(high, low, 20)
          rolling_range_percent(high, low, 8)
          dmi_adx(high, low, close, 14)
          rsi(close, 6)
          elapsed = time.perf_counter() - t
          print(f'indicator_100k_bars_seconds={elapsed:.4f}')
          PY
