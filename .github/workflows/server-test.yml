name: server-verification

on:
  push:
    branches: [main]
    paths:
      - 'universal_bot/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/server-test.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      run_backtest:
        description: Run the offline ETH/USDT 5m backtest
        required: false
        default: true
        type: boolean
      benchmark:
        description: Run performance benchmark
        required: false
        default: true
        type: boolean

# The runner may only write the generated verification report back to this repo.
permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, trading-bot]
    timeout-minutes: 45
    env:
      BOT_MODE: PAPER
      PYTHONUNBUFFERED: "1"
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime information
        id: runtime
        run: |
          set -euo pipefail
          mkdir -p .verification
          {
            echo "host=$(hostname)"
            echo "kernel=$(uname -a)"
            echo "python=$(python3 --version 2>&1)"
            echo "commit=$(git rev-parse HEAD)"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee .verification/runtime.txt

      - name: Prepare virtual environment
        id: prepare
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>&1 | tee .verification/install.log

      - name: Compile
        id: compile
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python -m compileall -q universal_bot 2>&1 | tee .verification/compile.log

      - name: Tests
        id: tests
        if: ${{ steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          pytest -q 2>&1 | tee .verification/tests.log

      - name: Backtest
        id: backtest
        if: ${{ steps.prepare.outcome == 'success' && (github.event_name == 'push' || inputs.run_backtest) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          /usr/bin/time -f 'wall_seconds=%e\nmax_rss_kb=%M' -o .verification/backtest_time.txt \
            python scripts/server_verify_backtest.py --symbol ETH/USDT:USDT --exchange bitget --timeframe 5m --start 2024-01-01 \
            2>&1 | tee .verification/backtest.log

      - name: Indicator benchmark
        id: benchmark
        if: ${{ steps.prepare.outcome == 'success' && (github.event_name == 'push' || inputs.benchmark) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          python - <<'PY' 2>&1 | tee .verification/benchmark.log
          import time
          import numpy as np
          import pandas as pd
          from universal_bot.indicators import dmi_adx, rsi, rolling_range_percent, sma

          n = 100_000
          idx = pd.date_range('2024-01-01', periods=n, freq='5min', tz='UTC')
          close = pd.Series(np.linspace(2000, 2500, n), index=idx)
          high = close + 2.0
          low = close - 2.0
          volume = pd.Series(1000.0, index=idx)
          t = time.perf_counter()
          sma(volume, 20)
          rolling_range_percent(high, low, 20)
          rolling_range_percent(high, low, 8)
          dmi_adx(high, low, close, 14)
          rsi(close, 6)
          elapsed = time.perf_counter() - t
          print(f'indicator_100k_bars_seconds={elapsed:.4f}')
          PY

      - name: Publish verification report
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BACKTEST_OUTCOME: ${{ steps.backtest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          set -euo pipefail
          mkdir -p reports
          REPORT=reports/latest-server-verification.md
          {
            echo "# Latest self-hosted server verification"
            echo
            echo "- Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Runner: $(hostname)"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- BOT_MODE: PAPER"
            echo
            echo "## Outcomes"
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| Prepare | ${PREPARE_OUTCOME:-not-run} |"
            echo "| Compile | ${COMPILE_OUTCOME:-not-run} |"
            echo "| Pytest | ${TESTS_OUTCOME:-not-run} |"
            echo "| ETH/USDT 5m backtest | ${BACKTEST_OUTCOME:-not-run} |"
            echo "| 100k indicator benchmark | ${BENCHMARK_OUTCOME:-not-run} |"
            echo
            echo "## Runtime"
            echo '```text'
            cat .verification/runtime.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Pytest"
            echo '```text'
            tail -n 120 .verification/tests.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Backtest"
            echo '```text'
            cat .verification/backtest_time.txt 2>/dev/null || true
            tail -n 180 .verification/backtest.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Indicator benchmark"
            echo '```text'
            cat .verification/benchmark.log 2>/dev/null || true
            echo '```'
            echo
            echo "## Install/compile diagnostics"
            echo '```text'
            tail -n 80 .verification/install.log 2>/dev/null || true
            tail -n 80 .verification/compile.log 2>/dev/null || true
            echo '```'
          } > "$REPORT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "ci: update server verification report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BACKTEST_OUTCOME: ${{ steps.backtest.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$PREPARE_OUTCOME" "$COMPILE_OUTCOME" "$TESTS_OUTCOME" "$BACKTEST_OUTCOME" "$BENCHMARK_OUTCOME"; do
            if [[ "$outcome" == "failure" ]]; then
              echo "Verification failed; see reports/latest-server-verification.md"
              exit 1
            fi
          done
          echo "All executed verification checks passed."
